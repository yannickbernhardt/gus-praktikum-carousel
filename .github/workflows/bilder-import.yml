name: Bilder importieren
on:
  push:
    branches: [bilder-import]
    paths: [bilder.txt]
permissions:
  contents: write
jobs:
  holen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bilder laden
        run: |
          mkdir -p public/fall/img
          while read -r name url; do
            [ -z "$name" ] && continue
            curl -sSfL "$url" -o "/tmp/$name.raw"
            file "/tmp/$name.raw"
            convert "/tmp/$name.raw" -resize '1080x1080>' -strip -quality 82 "public/fall/img/$name.jpg" || cp "/tmp/$name.raw" "public/fall/img/$name.jpg"
          done < bilder.txt
          ls -la public/fall/img
      - name: Einchecken
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/fall/img
          git commit -m "Bilder importiert" || echo "nichts zu tun"
          git push
