<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body { background: #fafafa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: #262626; display: flex; justify-content: center; min-height: 100vh; min-height: 100dvh; }
.app { width: 100%; max-width: 470px; background: #fff; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
button { font: inherit; }
.icon-btn { background: none; border: none; padding: 0; margin: 0; color: #262626; display: flex; cursor: pointer; }
.icon-btn:active { opacity: .5; }
.ring { width: 40px; height: 40px; border-radius: 50%; padding: 2px; flex: none;

.ava { width: 100%; height: 100%; border-radius: 50%; border: 2px solid #fff; display: flex; align-items: center;

.foto { width: 100%; aspect-ratio: 1 / 1; display: block; background: #eee; }

.kopf { display: flex; align-items: center; justify-content: space-between; padding: 9px 14px; position: sticky; top: 0;

.wer { display: flex; align-items: center; gap: 11px; }
.wer .ring { width: 38px; height: 38px; }
.name { font-weight: 600; font-size: 14px; line-height: 1.2; }
.ort { font-size: 12px; color: #262626; margin-top: 1px; }
.leiste { display: flex; align-items: center; padding: 10px 12px 2px; }

.herz.an svg { fill: #ed4956; stroke: #ed4956; }

.likes { padding: 6px 14px 0; font-weight: 600; font-size: 14px; }
.text { padding: 5px 14px 0; font-size: 14px; line-height: 1.42; }
.text b { font-weight: 600; margin-right: 4px; }
.tags { color: #00376b; }
.mehrk { padding: 6px 14px 0; font-size: 14px; color: #737373; }
.zeit { padding: 6px 14px 4px; font-size: 11px; color: #8e8e8e; letter-spacing: .02em; }

.top { display: flex; align-items: center; gap: 12px; padding: 10px 14px; position: sticky; top: 0; background: #fff; z-index: 5;
  border-bottom: 1px solid #efefef; font-weight: 700; font-size: 17px; }
.top .frei { flex: 1; }
.prof { display: flex; align-items: center; gap: 22px; padding: 16px 16px 8px; }
.prof .ring { width: 86px; height: 86px; padding: 3px; }
.prof .ava { font-size: 28px; border-width: 3px; }
.zahlen { flex: 1; display: flex; justify-content: space-around; text-align: center; font-size: 13px; }
.zahlen b { display: block; font-size: 17px; }
.bio { padding: 4px 16px 12px; font-size: 14px; line-height: 1.42; }
.bio b { font-weight: 600; }
.knoepfe { display: flex; gap: 6px; padding: 0 16px 14px; }
.knoepfe button { flex: 1; border: none; border-radius: 8px; padding: 7px 0; font-weight: 600; font-size: 14px; cursor: pointer; }
.folgen { background: #0095f6; color: #fff; } .folgen.ja { background: #efefef; color: #262626; }
.nachricht { background: #efefef; color: #262626; }
.tabs { display: flex; justify-content: center; border-top: 1px solid #efefef; padding: 10px 0; color: #262626; }
.tabs span { border-top: 1px solid #262626; margin-top: -11px; padding-top: 10px; }
.raster { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
.raster button { border: none; padding: 0; aspect-ratio: 1 / 1; cursor: pointer; background: #eee; }
.raster svg { width: 100%; height: 100%; display: block; }
.ueber { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; justify-content: center; align-items: flex-start;
  overflow-y: auto; z-index: 20; padding: 18px 0; }
.ueber[hidden] { display: none; }
.karte { background: #fff; width: 100%; max-width: 470px; border-radius: 10px; overflow: hidden; padding-bottom: 8px; }
.zu { display: flex; justify-content: flex-end; padding: 8px 10px 0; }
.zu button { background: none; border: none; font-size: 26px; line-height: 1; color: #262626; cursor: pointer; }
